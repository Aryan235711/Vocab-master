name: Nightly QA Tests

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI
  push:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      - name: Dictionary validation (fail-fast on bad entries)
        # Runs before browsers + tests so a malformed word entry blocks
        # the run in seconds instead of after a 10-minute Playwright wait.
        run: npm run validate

      - name: TypeScript check
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Tier 0 - Unit Tests + Coverage (Vitest)
        # Threshold gate is configured in vite.config.ts:
        # lines/statements/functions 85%, branches 75% on src/utils,
        # src/context, server.ts. PRs that drop below fail here.
        run: npm run coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Tier 1 - Standard E2E Tests
        run: npm run test:e2e
        
      - name: Tier 2 - Autonomous AI Tests
        # Skip if any prior step failed — no point burning Gemini quota on a known-broken build.
        # We explicitly enforce 1 worker to prevent hitting the 15 RPM Gemini free-tier rate limit.
        if: success()
        run: npx playwright test e2e/ai --workers=1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Send Alert on Failure
        # Only attempt webhook delivery when the secret actually exists, otherwise the
        # action throws a "missing input" error that masks the real failure.
        if: failure() && env.SLACK_WEBHOOK != ''
        uses: rtCamp/action-slack-notify@v2
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.WEBHOOK_URL }} # Can be Slack or Discord compatible webhook
          SLACK_TITLE: "Nightly QA Failed 🚨"
          SLACK_MESSAGE: "The autonomous Testing Department encountered an error. Please review the attached Playwright HTML report!"
          SLACK_COLOR: "#FF0000"
